name: CD

# Runs only after CI passes on main — prevents deploying broken code
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # BACKEND — build → ECR → ECS
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (ECR → ECS)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" ./backend
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"
          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Register new ECS task definition revision
        id: task-def
        run: |
          # Fetch current task definition, swap image URI, register new revision
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_FAMILY }}" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'taskDefinition' --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | python3 -c "
          import sys, json
          td = json.load(sys.stdin)
          td['containerDefinitions'][0]['image'] = '${{ steps.build.outputs.image }}'
          for k in ['taskDefinitionArn','revision','status','requiresAttributes',
                    'compatibilities','registeredAt','registeredBy']:
              td.pop(k, None)
          print(json.dumps(td))
          ")

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service with new task definition
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --task-definition "${{ steps.task-def.outputs.task_def_arn }}" \
            --desired-count 1 \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}"

      - name: Wait for ECS service to stabilize
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --region "${{ secrets.AWS_REGION }}"
          echo "Service is stable."

      - name: Smoke test — health endpoint
        run: |
          # Resolve EC2 public DNS via ECS → container instance → EC2
          TASK_ARN=$(aws ecs list-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service-name "${{ secrets.ECS_SERVICE }}" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'taskArns[0]' --output text)

          CI_ARN=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --tasks "$TASK_ARN" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'tasks[0].containerInstanceArn' --output text)

          EC2_ID=$(aws ecs describe-container-instances \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --container-instances "$CI_ARN" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'containerInstances[0].ec2InstanceId' --output text)

          EC2_DNS=$(aws ec2 describe-instances \
            --instance-ids "$EC2_ID" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'Reservations[0].Instances[0].PublicDnsName' --output text)

          echo "Smoke testing http://$EC2_DNS/health ..."
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$EC2_DNS/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP 200)."
              exit 0
            fi
            echo "  Attempt $i/5 — HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "ERROR: Health check failed after 5 attempts."
          exit 1

  # ──────────────────────────────────────────────
  # FRONTEND — build → S3 → CloudFront
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync dist/ to S3
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          # index.html must never be cached — always fetch fresh for React Router
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
          echo "CloudFront invalidation submitted."

      - name: Smoke test — CloudFront URL
        run: |
          CF_URL="https://$(aws cloudfront get-distribution \
            --id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --query 'Distribution.DomainName' --output text)"
          echo "Smoke testing $CF_URL ..."
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CF_URL")
            if [ "$STATUS" = "200" ]; then
              echo "CloudFront smoke test passed (HTTP 200)."
              exit 0
            fi
            echo "  Attempt $i/5 — HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "ERROR: CloudFront smoke test failed after 5 attempts."
          exit 1
