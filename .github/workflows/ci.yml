name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # BACKEND — tests
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: test-secret-key-min-32-characters-long
          JWT_EXPIRES_DAYS: 1
          CORS_ORIGINS: http://localhost:5173
        run: pytest --tb=short -q

  # ──────────────────────────────────────────────
  # BACKEND — security & privacy scan
  # ──────────────────────────────────────────────
  backend-security:
    name: Backend — Security & Privacy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit — static security analysis
        # -ll = medium+ severity, skip test files (they intentionally use weak passwords)
        run: bandit -r app/ -ll --skip B101 -q

      - name: Safety — dependency vulnerability check
        run: safety scan --policy-file .safety-policy.yml 2>/dev/null || safety scan
        continue-on-error: false

      - name: Privacy — scan for hardcoded secrets / PII patterns
        run: |
          echo "Scanning for hardcoded secrets and PII..."
          # Fail if any of these appear outside of test/config files
          PATTERNS='(password\s*=\s*["\x27][^"\x27]{6,}|secret\s*=\s*["\x27][^"\x27]{6,}|api_key\s*=\s*["\x27][^"\x27]{4,}|Bearer [A-Za-z0-9\-_.~+/]+=*)'
          if grep -rEn "$PATTERNS" app/ --include="*.py"; then
            echo "ERROR: Possible hardcoded credential or secret found above."
            exit 1
          fi
          echo "No hardcoded secrets found."

  # ──────────────────────────────────────────────
  # FRONTEND — code review (lint + type-check)
  # ──────────────────────────────────────────────
  frontend-review:
    name: Frontend — Code Review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — type check
        run: npx tsc --noEmit

      - name: oxlint — lint
        run: npm run lint

  # ──────────────────────────────────────────────
  # FRONTEND — security & privacy scan
  # ──────────────────────────────────────────────
  frontend-security:
    name: Frontend — Security & Privacy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit — dependency vulnerabilities
        # moderate+ severity fails the build
        run: npm audit --audit-level=moderate

      - name: Privacy — scan for hardcoded tokens / API keys
        run: |
          echo "Scanning frontend source for hardcoded credentials..."
          PATTERNS='(api_key|apikey|secret|password|token)\s*[:=]\s*["\x27][A-Za-z0-9+/\-_]{8,}'
          if grep -rEin "$PATTERNS" src/ --include="*.ts" --include="*.tsx"; then
            echo "ERROR: Possible hardcoded credential found in frontend source."
            exit 1
          fi
          echo "No hardcoded credentials found."
