name: Start Services

# Starts RDS, then EC2, then scales ECS back to 1 task.
# Runs a health-check smoke test once the service is stable.
on:
  workflow_dispatch:

jobs:
  start-services:
    name: Start RDS → EC2 → ECS
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Step 1 — start RDS first; the app needs the DB on startup
      - name: Start RDS instance
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier my-trip-advisor-db \
            --query 'DBInstances[0].DBInstanceStatus' \
            --region "${{ secrets.AWS_REGION }}" \
            --output text 2>/dev/null || echo "not-found")

          if [[ "$STATUS" == "available" ]]; then
            echo "RDS is already available — skipping start."
          elif [[ "$STATUS" == "stopped" ]]; then
            echo "Starting RDS instance..."
            aws rds start-db-instance \
              --db-instance-identifier my-trip-advisor-db \
              --region "${{ secrets.AWS_REGION }}"
            echo "Waiting for RDS to become available (~5 min)..."
            aws rds wait db-instance-available \
              --db-instance-identifier my-trip-advisor-db \
              --region "${{ secrets.AWS_REGION }}"
            echo "RDS is available."
          else
            echo "RDS status is '$STATUS' — cannot start from this state."
            exit 1
          fi

      # Step 2 — start the EC2 host
      - name: Start EC2 instance
        run: |
          EC2_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=my-trip-advisor-ecs-host" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --region "${{ secrets.AWS_REGION }}" \
            --output text)

          if [[ -z "$EC2_ID" || "$EC2_ID" == "None" ]]; then
            echo "ERROR: Could not find EC2 instance tagged 'my-trip-advisor-ecs-host'."
            exit 1
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$EC2_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --region "${{ secrets.AWS_REGION }}" \
            --output text)

          if [[ "$STATE" == "running" ]]; then
            echo "EC2 instance $EC2_ID is already running — skipping start."
          else
            echo "Starting EC2 instance: $EC2_ID"
            aws ec2 start-instances \
              --instance-ids "$EC2_ID" \
              --region "${{ secrets.AWS_REGION }}"
            aws ec2 wait instance-running \
              --instance-ids "$EC2_ID" \
              --region "${{ secrets.AWS_REGION }}"
            echo "EC2 instance is running."
          fi

      # Step 3 — wait for the ECS agent on the EC2 host to register
      - name: Wait for EC2 to register with ECS cluster
        run: |
          echo "Waiting for EC2 to register with ECS cluster..."
          for i in $(seq 1 20); do
            COUNT=$(aws ecs list-container-instances \
              --cluster "${{ secrets.ECS_CLUSTER }}" \
              --status ACTIVE \
              --region "${{ secrets.AWS_REGION }}" \
              --query 'length(containerInstanceArns)' \
              --output text)
            if [[ "$COUNT" -ge 1 ]]; then
              echo "EC2 registered with ECS cluster ($COUNT instance(s) active)."
              break
            fi
            echo "  Still waiting... ($i/20)"
            sleep 15
          done
          if [[ "$COUNT" -lt 1 ]]; then
            echo "ERROR: EC2 did not register with ECS within 5 minutes."
            exit 1
          fi

      # Step 4 — scale ECS service back up to 1 task
      - name: Start ECS service (DesiredCount → 1)
        run: |
          echo "Setting ECS desired count to 1..."
          aws ecs update-service \
            --cluster       "${{ secrets.ECS_CLUSTER }}" \
            --service       "${{ secrets.ECS_SERVICE }}" \
            --desired-count 1 \
            --force-new-deployment \
            --region        "${{ secrets.AWS_REGION }}"

          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster  "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --region   "${{ secrets.AWS_REGION }}"
          echo "ECS service is stable."

      # Step 5 — smoke test to confirm the backend is responding
      - name: Smoke test — health endpoint
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster      "${{ secrets.ECS_CLUSTER }}" \
            --service-name "${{ secrets.ECS_SERVICE }}" \
            --region       "${{ secrets.AWS_REGION }}" \
            --query 'taskArns[0]' --output text)

          CI_ARN=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --tasks   "$TASK_ARN" \
            --region  "${{ secrets.AWS_REGION }}" \
            --query 'tasks[0].containerInstanceArn' --output text)

          EC2_ID=$(aws ecs describe-container-instances \
            --cluster             "${{ secrets.ECS_CLUSTER }}" \
            --container-instances "$CI_ARN" \
            --region              "${{ secrets.AWS_REGION }}" \
            --query 'containerInstances[0].ec2InstanceId' --output text)

          EC2_DNS=$(aws ec2 describe-instances \
            --instance-ids "$EC2_ID" \
            --region       "${{ secrets.AWS_REGION }}" \
            --query 'Reservations[0].Instances[0].PublicDnsName' --output text)

          echo "Smoke testing http://$EC2_DNS/health ..."
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$EC2_DNS/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP 200)."
              exit 0
            fi
            echo "  Attempt $i/5 — HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "ERROR: Health check failed after 5 attempts."
          exit 1

      - name: Summary
        run: |
          echo ""
          echo "Services started:"
          echo "  ✓ RDS available"
          echo "  ✓ EC2 running"
          echo "  ✓ ECS service stable (1 task running)"
          echo "  ✓ Health check passed"
          echo ""
          echo "Backend: ${{ secrets.VITE_API_BASE_URL }}"
